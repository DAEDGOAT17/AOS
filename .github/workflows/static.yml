name: Deploy GitHub Pages site

on:
  push:
    branches: ["pankaj"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate docs glossary and search index
        run: python3 tools/generate_docs_index.py

      - name: Validate documentation site
        run: python3 tools/check_docs.py

      - name: Ensure generated docs are included in the repo state
        run: git diff --exit-code -- docs/blog_docs/FUNCTION_GLOSSARY.md docs/blog_docs/FUNCTION_GLOSSARY.html docs/blog_docs/search-index.js

  deploy:
    needs: validate-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Pages content
        run: python3 tools/generate_docs_index.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
